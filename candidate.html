<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Candidate Hub for global technology opportunities with Consult & Hire." />
  <title>Candidate Hub | Consult & Hire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: '#100B24',
              navy: '#171033',
              purple: '#6D4AFF',
              violet: '#9B7BFF',
              blue: '#4F8CFF'
            }
          },
          boxShadow: {
            soft: '0 18px 55px rgba(8, 5, 24, .32)'
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .page-bg {
      background:
        radial-gradient(circle at 14% 12%, rgba(109,74,255,.24), transparent 28%),
        radial-gradient(circle at 88% 82%, rgba(79,140,255,.18), transparent 30%),
        linear-gradient(145deg, #100b24 0%, #171033 52%, #100b24 100%);
    }

    .page-bg::before,
    .page-bg::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.07);
      pointer-events: none;
    }

    .page-bg::before {
      width: 44rem;
      height: 11rem;
      left: -24rem;
      top: 18%;
      transform: rotate(-10deg);
    }

    .page-bg::after {
      width: 40rem;
      height: 10rem;
      right: -22rem;
      bottom: 7%;
      transform: rotate(9deg);
    }

    .glass-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(140deg, rgba(255,255,255,.3), rgba(255,255,255,.035));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .image-card img { transition: transform .55s cubic-bezier(.2,.7,.2,1); }
    .image-card:hover img { transform: scale(1.045); }
    .image-card:hover .arrow { transform: translateX(4px); }

    @media (max-height: 700px) and (min-width: 768px) {
      .hero-copy h1 { font-size: 2.6rem; }
      .hub-card { min-height: 8rem; }
    }

    @media (max-width: 767px) {
      html, body { overflow: auto; }
      body { min-height: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body class="bg-brand-ink text-white antialiased">
  <div class="page-bg relative flex min-h-[100dvh] flex-col overflow-hidden">
    <header class="relative z-30 shrink-0 border-b border-white/10 bg-brand-ink/55 backdrop-blur-xl">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 sm:px-8 lg:px-10">
        <a href="index.html" class="text-lg font-semibold tracking-tight text-white" aria-label="Consult and Hire home">
          Consult<span class="text-brand-violet">&amp;</span>Hire
        </a>

        <nav class="hidden items-center gap-7 text-sm text-white/68 md:flex" aria-label="Primary navigation">
          <a href="index.html" class="transition hover:text-white">Home</a>
          <a href="about.html" class="transition hover:text-white">About</a>
          <a href="contact.html" class="transition hover:text-white">Contact</a>
          <a href="employer.html" class="rounded-full border border-white/18 px-4 py-2 font-medium text-white transition hover:bg-white/10">Employer Hub</a>
        </nav>

        <a href="employer.html" class="rounded-full border border-white/18 px-3.5 py-2 text-xs font-medium text-white md:hidden">Employer Hub</a>
      </div>
    </header>

    <main class="relative z-10 flex min-h-0 flex-1 items-center px-5 py-4 sm:px-8 sm:py-5 lg:px-10">
      <div class="mx-auto grid h-full max-h-[760px] w-full max-w-7xl min-h-0 gap-4 md:grid-cols-[.72fr_1.28fr] lg:gap-5">
        <section class="hero-copy glass-border relative flex min-h-0 flex-col justify-between overflow-hidden rounded-[1.7rem] bg-white/[.045] p-6 shadow-soft sm:p-8 lg:p-9">
          <div>
            <a href="index.html" class="inline-flex items-center gap-2 text-xs text-white/45 transition hover:text-white">
              <span aria-hidden="true">←</span> Home
            </a>

            <div class="mt-7 inline-flex items-center gap-2 rounded-full border border-white/14 bg-white/5 px-3.5 py-2 text-[10px] font-semibold uppercase tracking-[.19em] text-white/65">
              <span class="h-1.5 w-1.5 rounded-full bg-brand-violet shadow-[0_0_12px_rgba(155,123,255,.95)]"></span>
              Candidate Hub
            </div>

            <h1 class="mt-5 text-4xl font-semibold leading-[.98] tracking-[-.055em] sm:text-5xl lg:text-6xl">
              Find what’s <span class="bg-gradient-to-r from-white via-brand-violet to-brand-blue bg-clip-text text-transparent">next.</span>
            </h1>
          </div>

          <div class="relative mt-6 min-h-[170px] flex-1 overflow-hidden rounded-[1.35rem] md:max-h-[330px]">
            <img src="tech-team-city.png" alt="Modern software engineering team collaborating in a technology office" class="absolute inset-0 h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-brand-ink/70 via-transparent to-transparent"></div>
            <div class="absolute bottom-4 left-4 rounded-full border border-white/16 bg-brand-ink/45 px-3 py-1.5 text-[10px] font-medium uppercase tracking-[.14em] text-white/72 backdrop-blur-md">
              Engineering · AI · Data Science
            </div>
          </div>
        </section>

        <section class="grid min-h-0 grid-cols-2 grid-rows-2 gap-4 lg:gap-5" aria-label="Candidate Hub options">
          <a href="jobs.html" class="hub-card image-card glass-border group relative min-h-[145px] overflow-hidden rounded-[1.7rem] bg-white/[.045] shadow-soft">
            <img src="WFH_Stock_Image.png" alt="Developer working with code" class="absolute inset-0 h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-brand-ink via-brand-ink/24 to-transparent"></div>
            <div class="absolute inset-x-0 bottom-0 flex items-center justify-between gap-3 p-5 sm:p-6">
              <h2 class="text-xl font-semibold tracking-tight sm:text-2xl">Explore Roles</h2>
              <span class="arrow text-xl text-white/70 transition">→</span>
            </div>
          </a>

          <a href="register.html" class="hub-card image-card glass-border group relative min-h-[145px] overflow-hidden rounded-[1.7rem] bg-white/[.045] shadow-soft">
            <img src="developers-cloud.png" alt="Technology professionals collaborating" class="absolute inset-0 h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-brand-ink via-brand-ink/25 to-transparent"></div>
            <div class="absolute inset-x-0 bottom-0 flex items-center justify-between gap-3 p-5 sm:p-6">
              <h2 class="text-xl font-semibold tracking-tight sm:text-2xl">Join Network</h2>
              <span class="arrow text-xl text-white/70 transition">→</span>
            </div>
          </a>

          <a href="career-advice.html" class="hub-card image-card glass-border group relative min-h-[145px] overflow-hidden rounded-[1.7rem] bg-white/[.045] shadow-soft">
            <img src="tech-team-whiteboard.png" alt="Technology team discussing ideas" class="absolute inset-0 h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-brand-ink via-brand-ink/28 to-transparent"></div>
            <div class="absolute inset-x-0 bottom-0 flex items-center justify-between gap-3 p-5 sm:p-6">
              <h2 class="text-xl font-semibold tracking-tight sm:text-2xl">Career Advice</h2>
              <span class="arrow text-xl text-white/70 transition">→</span>
            </div>
          </a>

          <a href="contact.html" class="hub-card image-card glass-border group relative min-h-[145px] overflow-hidden rounded-[1.7rem] bg-white/[.045] shadow-soft">
            <img src="tech-team-city.png" alt="Modern technology team" class="absolute inset-0 h-full w-full object-cover object-right" />
            <div class="absolute inset-0 bg-gradient-to-t from-brand-ink via-brand-ink/30 to-transparent"></div>
            <div class="absolute inset-x-0 bottom-0 flex items-center justify-between gap-3 p-5 sm:p-6">
              <h2 class="text-xl font-semibold tracking-tight sm:text-2xl">Talk to Us</h2>
              <span class="arrow text-xl text-white/70 transition">→</span>
            </div>
          </a>
        </section>
      </div>
    </main>

    <footer class="relative z-20 hidden h-9 shrink-0 items-center justify-between border-t border-white/8 px-5 text-[11px] text-white/32 sm:px-8 md:flex lg:px-10">
      <span>© <span id="year"></span> Consult &amp; Hire</span>
      <div class="flex gap-4"><a href="privacy.html" class="hover:text-white">Privacy</a><a href="terms-of-use.html" class="hover:text-white">Terms</a></div>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
